<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrends - Medical Insights from Reddit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2a2a2a;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }
    </style>
</head>
<body class="bg-[#1e1e1e] text-[#f5f5f5] min-h-screen">
    <!-- Top Navigation -->
    <nav class="border-b border-[#2a2a2a] px-4 py-3">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
                </svg>
                <h1 class="text-xl font-medium">MediTrends</h1>
            </div>
            <button class="p-2 hover:bg-[#2a2a2a] rounded-lg transition-colors" aria-label="Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- Search Section -->
        <div class="max-w-3xl mx-auto mb-8">
            <h2 class="text-2xl font-light text-center mb-2">Search Medical Discussions</h2>
            <p class="text-[#a0a0a0] text-center mb-6">Find health insights from Reddit communities</p>
            
            <form id="searchForm" class="flex gap-3">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="Describe your symptoms or health concern..."
                    class="flex-1 px-4 py-3 bg-[#2a2a2a] border border-[#3a3a3a] rounded-lg focus:outline-none focus:border-[#4a4a4a] focus:bg-[#2d2d2d] transition-colors placeholder-[#6a6a6a]"
                    aria-label="Search query"
                />
                <button 
                    type="submit"
                    class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-[#1e1e1e]"
                >
                    Search
                </button>
            </form>

            <!-- Trending Topics -->
            <div id="trendingTopics" class="mt-4 flex flex-wrap gap-2 justify-center opacity-0 transition-opacity duration-300">
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden">
            <div class="flex flex-col items-center justify-center py-12">
                <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500 mb-4"></div>
                <p class="text-[#a0a0a0]">Searching Reddit communities...</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden">
            <div class="max-w-2xl mx-auto bg-red-900/20 border border-red-800/50 rounded-lg p-6 text-center">
                <p class="text-red-400 mb-2">Something went wrong</p>
                <p class="text-sm text-[#a0a0a0]" id="errorMessage"></p>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="hidden">
            <div class="mb-6 flex items-center justify-between">
                <h3 class="text-lg font-medium">
                    <span id="resultCount">0</span> results found
                    <span class="text-sm text-[#a0a0a0] ml-2">(<span id="searchTime">0</span>s)</span>
                </h3>
                <select id="sortOptions" class="bg-[#2a2a2a] border border-[#3a3a3a] rounded px-3 py-1 text-sm focus:outline-none focus:border-[#4a4a4a]">
                    <option value="relevance">Most Relevant</option>
                    <option value="top">Top Rated</option>
                    <option value="new">Most Recent</option>
                    <option value="hot">Hot</option>
                </select>
            </div>

            <!-- Results Container -->
            <div id="resultsContainer" class="space-y-4">
                <!-- Results will be inserted here -->
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12">
            <svg class="w-16 h-16 mx-auto mb-4 text-[#4a4a4a]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <p class="text-[#a0a0a0]">Enter a health topic to search Reddit discussions</p>
        </div>
    </main>

    <script>
        // API Configuration
        const API_BASE_URL = 'http://localhost:5000/api';
        
        // DOM Elements
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const resultsSection = document.getElementById('resultsSection');
        const resultsContainer = document.getElementById('resultsContainer');
        const emptyState = document.getElementById('emptyState');
        const resultCount = document.getElementById('resultCount');
        const searchTime = document.getElementById('searchTime');
        const sortOptions = document.getElementById('sortOptions');
        const trendingTopics = document.getElementById('trendingTopics');

        // State
        let currentQuery = '';
        let currentResults = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTrendingTopics();
        });

        // Load trending topics
        async function loadTrendingTopics() {
            try {
                const response = await fetch(`${API_BASE_URL}/trending?limit=5`);
                const data = await response.json();
                
                if (data.data && data.data.trending_topics) {
                    const topics = data.data.trending_topics.slice(0, 5);
                    const topicsHtml = topics.map(topic => 
                        `<button class="px-3 py-1 bg-[#2a2a2a] hover:bg-[#3a3a3a] rounded-full text-sm transition-colors" onclick="searchTopic('${topic.topic}')">${topic.topic}</button>`
                    ).join('');
                    
                    trendingTopics.innerHTML = topicsHtml;
                    trendingTopics.classList.add('opacity-100');
                }
            } catch (error) {
                console.error('Failed to load trending topics:', error);
            }
        }

        // Search for a specific topic
        function searchTopic(topic) {
            searchInput.value = topic;
            performSearch();
        }

        // Handle search form submission
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            performSearch();
        });

        // Handle sort change
        sortOptions.addEventListener('change', () => {
            if (currentQuery) {
                performSearch();
            }
        });

        // Perform search
        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            currentQuery = query;
            showLoading();

            try {
                const sort = sortOptions.value;
                const response = await fetch(`${API_BASE_URL}/search?q=${encodeURIComponent(query)}&sort=${sort}&limit=50&use_ml=true`);
                const data = await response.json();

                if (data.status === 'success' && data.data) {
                    displayResults(data.data);
                } else {
                    showError(data.error || 'Failed to fetch results');
                }
            } catch (error) {
                showError('Network error. Please check your connection.');
                console.error('Search error:', error);
            }
        }

        // Display results
        function displayResults(data) {
            hideAll();
            
            currentResults = data.results || [];
            resultCount.textContent = currentResults.length;
            searchTime.textContent = (data.metadata?.search_time_seconds || 0).toFixed(2);
            
            if (currentResults.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.innerHTML = `
                    <svg class="w-16 h-16 mx-auto mb-4 text-[#4a4a4a]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p class="text-[#a0a0a0]">No results found for "${currentQuery}"</p>
                    <p class="text-sm text-[#6a6a6a] mt-2">Try different keywords or check your spelling</p>
                `;
                return;
            }

            resultsContainer.innerHTML = currentResults.map(result => createResultCard(result)).join('');
            resultsSection.classList.remove('hidden');
        }

        // Create result card HTML
        function createResultCard(result) {
            const date = new Date(result.created_datetime);
            const formattedDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const score = result.score || 0;
            const comments = result.num_comments || 0;
            
            return `
                <article class="bg-[#2a2a2a] rounded-lg p-5 hover:bg-[#2d2d2d] transition-colors">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="text-lg font-medium leading-tight flex-1 mr-4">
                            <a href="${result.permalink}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-400 transition-colors">
                                ${escapeHtml(result.title)}
                            </a>
                        </h3>
                        <span class="text-xs text-[#6a6a6a] whitespace-nowrap">${formattedDate}</span>
                    </div>
                    
                    <p class="text-[#d0d0d0] text-sm mb-3 leading-relaxed">
                        ${escapeHtml(result.snippet || result.body.substring(0, 200) + '...')}
                    </p>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4 text-xs text-[#8a8a8a]">
                            <span class="flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                                </svg>
                                ${score}
                            </span>
                            <span class="flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                                </svg>
                                ${comments}
                            </span>
                            <span class="px-2 py-1 bg-[#1e1e1e] rounded">r/${result.subreddit}</span>
                        </div>
                        <a href="${result.permalink}" target="_blank" rel="noopener noreferrer" 
                           class="text-blue-500 hover:text-blue-400 text-sm font-medium transition-colors">
                            View More →
                        </a>
                    </div>
                </article>
            `;
        }

        // Utility functions
        function showLoading() {
            hideAll();
            loadingState.classList.remove('hidden');
        }

        function showError(message) {
            hideAll();
            errorMessage.textContent = message;
            errorState.classList.remove('hidden');
        }

        function hideAll() {
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');
            resultsSection.classList.add('hidden');
            emptyState.classList.add('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
